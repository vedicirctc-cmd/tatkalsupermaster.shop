<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatkal Store - Automated Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkblack: '#090a0f',
                        navycard: '#111827',
                        navyaccent: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkblack text-white min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-navycard border-b border-navyaccent p-4 sticky top-0 z-50 flex justify-between items-center px-6">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">⚡ TATKAL MASTER</h1>
        <a id="supportLink" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Help & Support</a>
    </header>

    <!-- Main Store Container -->
    <main class="container mx-auto p-6 flex-grow">
        <h2 class="text-2xl font-bold mb-6 text-slate-200">Available Digital Products</h2>
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Dynamic Products Injected Here -->
        </div>
    </main>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-navycard border border-navyaccent rounded-xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4 text-blue-400">Complete Payment</h3>
            <p class="text-sm text-slate-400 mb-4">Scan QR or pay via Pay0, then enter your details below.</p>
            
            <div class="bg-darkblack p-4 rounded-lg mb-4 text-center border border-navyaccent">
                <p class="text-sm text-slate-300 font-semibold mb-2">Pay via Pay0 UPI / QR</p>
                <div id="pay0QrBox" class="text-blue-400 text-xs break-all">Merchant ID: <span id="midDisplay"></span></div>
            </div>

            <form id="orderForm" onsubmit="submitOrder(event)">
                <input type="hidden" id="modalProductId">
                <div class="mb-3">
                    <label class="block text-xs text-slate-400 mb-1">Your Email</label>
                    <input type="email" id="userEmail" required class="w-full bg-darkblack border border-navyaccent rounded p-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-1">UTR / Transaction Reference Number</label>
                    <input type="text" id="utrNumber" required placeholder="Enter 12-digit UTR" class="w-full bg-darkblack border border-navyaccent rounded p-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">Cancel</button>
                    <button type="submit" id="payBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-bold">Verify & Get Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Delivery Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/80 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-navycard border border-green-500/50 rounded-xl p-6 w-full max-w-md text-center">
            <h3 class="text-2xl font-bold text-green-400 mb-2">Payment Successful! 🎉</h3>
            <p class="text-xs text-slate-400 mb-4">Your order has been automatically delivered below:</p>
            <textarea id="deliveredContentBox" readonly class="w-full h-32 bg-darkblack border border-navyaccent rounded p-3 text-green-300 text-sm font-mono mb-4 focus:outline-none"></textarea>
            <button onclick="location.reload()" class="w-full py-2 bg-green-600 hover:bg-green-500 rounded text-sm font-bold">Done</button>
        </div>
    </div>

    <footer class="bg-navycard border-t border-navyaccent text-center p-4 text-xs text-slate-500">
        &copy; 2026 Tatkal Super Master. All rights reserved.
    </footer>

    <script>
        let settingsData = {};
        async function loadStore() {
            const res = await fetch('/api/store');
            const data = await res.json();
            settingsData = data.settings;
            document.getElementById('supportLink').href = settingsData.support_link || '#';
            document.getElementById('midDisplay').innerText = settingsData.pay0_merchant_id || 'Not Set';

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            data.products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-navycard border border-navyaccent rounded-xl p-4 flex flex-col justify-between">
                        <div>
                            <img src="${p.image || 'https://via.placeholder.com/300x150'}" class="w-full h-36 object-cover rounded-lg mb-3">
                            <h3 class="font-bold text-lg text-slate-100">${p.name}</h3>
                            <p class="text-xs text-slate-400 mt-1 mb-3">${p.description}</p>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-lg font-bold text-blue-400">₹${p.price}</span>
                                <span class="text-xs px-2 py-1 rounded ${p.stock_count > 0 ? 'bg-green-900/50 text-green-400 border border-green-700' : 'bg-red-900/50 text-red-400 border border-red-700'}">
                                    Stock: ${p.stock_count}
                                </span>
                            </div>
                            <button ${p.stock_count <= 0 ? 'disabled' : ''} onclick="openCheckout(${p.id})" class="w-full py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-600 rounded font-bold text-sm transition">
                                ${p.stock_count > 0 ? 'Buy Now' : 'Out of Stock'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openCheckout(productId) {
            document.getElementById('modalProductId').value = productId;
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            btn.innerText = 'Verifying UTR...';
            btn.disabled = true;

            const payload = {
                productId: document.getElementById('modalProductId').value,
                email: document.getElementById('userEmail').value,
                utrNumber: document.getElementById('utrNumber').value
            };

            const res = await fetch('/api/order/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if(data.success) {
                closeModal();
                document.getElementById('deliveredContentBox').value = data.deliveredContent;
                document.getElementById('successModal').classList.remove('hidden');
            } else {
                alert(data.error || 'Payment verification failed');
                btn.innerText = 'Verify & Get Product';
                btn.disabled = false;
            }
        }

        loadStore();
    </script>
</body>
</html>
